name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify scanner and scan all commits
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
          set +e
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner \
            --report-format=json \
            --report-path="$RUNNER_TEMP/gitleaks-findings.json" \
            --log-opts='--all --full-history' .
          result=$?
          set -e
          if [ -s "$RUNNER_TEMP/gitleaks-findings.json" ]; then
            python3 - "$RUNNER_TEMP/gitleaks-findings.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as report:
              findings = json.load(report)
          for item in findings:
              print(
                  "FINDING_METADATA",
                  "rule=" + str(item.get("RuleID", "")),
                  "file=" + str(item.get("File", "")),
                  "line=" + str(item.get("StartLine", "")),
                  "commit=" + str(item.get("Commit", ""))[:12],
              )
          PY
          fi
          exit "$result"
