name: Release
on:
  push:
    tags: ['2026.*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/package_release.py "$GITHUB_REF_NAME"
      - name: Publish installable archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/cca_zaluzie.zip --verify-tag --title "CCA Žalúzie $GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
