name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ha: '2026.10.0'
            plugin: '0.13.371'
            frontend: '20260930.2'
          - ha: '2026.10.1'
            plugin: '0.13.372'
            frontend: '20260930.3'
    name: Home Assistant ${{ matrix.ha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component==${{ matrix.plugin }} home-assistant-frontend==${{ matrix.frontend }} ruff==0.17.0
      - run: python -m pytest -q
      - run: ruff check custom_components tests
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
