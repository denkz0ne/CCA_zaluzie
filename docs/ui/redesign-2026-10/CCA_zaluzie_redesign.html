<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CCA Žalúzie — návrh rozhrania</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #0288d1;
        --primary-soft: #e4f3fc;
        --bg: #f5f6f8;
        --card: #fff;
        --text: #202b33;
        --secondary: #64727e;
        --line: #dfe4e9;
        --green: #277a52;
        --green-soft: #e9f5ed;
        --amber: #916006;
        --amber-soft: #fff4d9;
        --red: #c33c37;
        --radius: 12px;
        --shadow: 0 1px 2px #15212c05;
        font-family: Roboto, "Segoe UI", Arial, sans-serif;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body.dark {
        color-scheme: dark;
        --primary: #66c9fa;
        --primary-soft: #16394c;
        --bg: #10171d;
        --card: #1b252d;
        --text: #e4edf4;
        --secondary: #9faeba;
        --line: #35434e;
        --green: #8bd1ab;
        --green-soft: #183d2c;
        --amber: #f0c36b;
        --amber-soft: #40351f;
        --red: #ff9c97;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled,
      input:disabled,
      select:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }
      button {
        border: 0;
        background: none;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
      }
      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }
      h1 {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      h2 {
        font-size: 19px;
        font-weight: 600;
      }
      h3 {
        font-size: 16px;
        font-weight: 600;
      }
      small,
      .muted {
        color: var(--secondary);
      }
      small {
        font-size: 12px;
      }
      svg.icon {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon-sm .icon {
        width: 18px;
        height: 18px;
      }
      .prototype {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--primary-soft);
        padding: 7px 26px;
        font-size: 12px;
        color: var(--primary);
      }
      .prototype a {
        color: inherit;
      }
      .appbar {
        background: var(--card);
        border-bottom: 1px solid var(--line);
        padding: 17px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .brand,
      .flex,
      .title-line,
      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand > .icon {
        width: 31px;
        height: 31px;
        color: var(--primary);
      }
      .brand small {
        display: block;
        margin-top: 4px;
      }
      .btn {
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 10px 17px;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 600;
        background: var(--card);
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--primary-soft);
      }
      .btn.primary {
        background: var(--primary);
        color: var(--card);
        border-color: var(--primary);
      }
      .btn.flat {
        color: var(--primary);
        border-color: transparent;
        background: transparent;
      }
      .icon-btn {
        width: 40px;
        height: 40px;
        display: inline-grid;
        place-items: center;
        border-radius: 50%;
        color: var(--secondary);
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .layout {
        max-width: 1560px;
        margin: 0 auto;
        padding: 24px;
        display: grid;
        grid-template-columns: 274px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .sidebar {
        position: sticky;
        top: 20px;
      }
      .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 0 4px 14px;
      }
      .sidebar-head h2 {
        font-size: 15px;
      }
      .count {
        font-size: 12px;
        color: var(--secondary);
      }
      .cover-list {
        display: grid;
        gap: 10px;
      }
      .cover-row {
        display: block;
        text-align: left;
        padding: 15px;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: var(--radius);
        width: 100%;
        transition: background 0.15s;
      }
      .cover-row:hover {
        border-color: var(--primary);
      }
      .cover-row.selected {
        border: 2px solid var(--primary);
        padding: 14px;
        background: var(--primary-soft);
      }
      .cover-top {
        display: flex;
        gap: 11px;
        align-items: center;
      }
      .cover-top .cover-symbol {
        color: var(--primary);
        width: 38px;
        height: 42px;
      }
      .cover-name {
        font-size: 15px;
        font-weight: 650;
        flex: 1;
        line-height: 1.4;
      }
      .cover-number {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.8px;
      }
      .cover-row .mode {
        margin: 10px 0 9px;
      }
      .cover-next {
        font-size: 12px;
        color: var(--secondary);
        display: flex;
        gap: 7px;
        align-items: center;
        line-height: 1.5;
      }
      .cover-next b {
        color: var(--text);
        font-weight: 600;
      }
      .mode,
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 6px;
        font-size: 12px;
        padding: 4px 7px;
        font-weight: 550;
        background: var(--green-soft);
        color: var(--green);
      }
      .mode.manual,
      .badge.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .mode.off {
        background: var(--bg);
        color: var(--secondary);
      }
      .mode.blue {
        color: var(--primary);
        background: var(--primary-soft);
      }
      .mode .icon,
      .badge .icon {
        height: 15px;
        width: 15px;
      }
      .sidebar-foot {
        font-size: 12px;
        line-height: 1.6;
        color: var(--secondary);
        margin: 14px 4px;
      }
      .main {
        min-width: 0;
      }
      .tabs {
        display: flex;
        border-bottom: 1px solid var(--line);
        gap: 28px;
        margin-bottom: 22px;
      }
      .tab {
        padding: 0 4px 13px;
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 15px;
        color: var(--secondary);
        font-weight: 600;
        border-bottom: 3px solid transparent;
      }
      .tab.active {
        color: var(--primary);
        border-color: var(--primary);
      }
      .context {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 18px;
      }
      .context .name {
        font-size: 25px;
        font-weight: 600;
        letter-spacing: -0.5px;
      }
      .context small {
        display: block;
        margin-top: 5px;
      }
      .head-switch {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 15px;
      }
      .head-switch strong {
        display: block;
        font-size: 13px;
      }
      .head-switch small {
        margin-top: 3px;
        font-size: 11px;
      }
      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        min-height: 44px;
        flex-shrink: 0;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 52px;
        height: 32px;
        cursor: pointer;
      }
      .track {
        pointer-events: none;
        display: inline-block;
        width: 52px;
        height: 32px;
        background: #87939f;
        border: 2px solid #87939f;
        border-radius: 20px;
        position: relative;
        flex-shrink: 0;
      }
      .track:after {
        content: "";
        position: absolute;
        width: 23px;
        height: 23px;
        top: 2.5px;
        left: 3px;
        border-radius: 50%;
        background: white;
        transition: transform 0.15s;
      }
      .switch input:checked + .track {
        background: var(--primary);
        border-color: var(--primary);
      }
      .switch input:checked + .track:after {
        transform: translateX(19px);
      }
      .switch input:focus-visible + .track {
        outline: 3px solid var(--primary);
        outline-offset: 4px;
      }
      .switch input:disabled + .track {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .toggle-copy {
        font-weight: 600;
      }
      .toggle-copy small {
        display: block;
        font-weight: 400;
        margin-top: 4px;
        max-width: 420px;
        line-height: 1.5;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: visible;
      }
      .pad {
        padding: 22px;
      }
      .overview-grid {
        display: grid;
        grid-template-columns: 1.15fr 1fr;
        gap: 18px;
      }
      .card-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 19px;
      }
      .card-head h3 {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .card-head .icon {
        color: var(--secondary);
      }
      .position-layout {
        display: flex;
        align-items: center;
        gap: 25px;
        margin: 7px 0 21px;
      }
      .blind-illustration {
        width: 80px;
        height: 104px;
        color: var(--primary);
        flex-shrink: 0;
      }
      .position-number {
        font-size: 43px;
        font-weight: 500;
        letter-spacing: -1.5px;
        line-height: 1;
      }
      .position-number span {
        font-size: 25px;
        color: var(--secondary);
      }
      .position-caption {
        margin: 8px 0 10px;
        color: var(--secondary);
        font-size: 13px;
      }
      .position-target {
        color: var(--secondary);
        font-size: 12px;
      }
      .position-target b {
        color: var(--text);
      }
      .motor-controls {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 9px;
      }
      .motor {
        min-height: 70px;
        background: var(--primary-soft);
        color: var(--primary);
        border: 1px solid transparent;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 6px;
        font-weight: 600;
      }
      .motor .icon {
        width: 26px;
        height: 26px;
      }
      .motor.stop {
        background: var(--bg);
        color: var(--text);
        border-color: var(--line);
      }
      .motor:hover {
        border-color: var(--primary);
      }
      .motor[aria-pressed="true"] {
        background: var(--primary);
        color: var(--card);
      }
      .range-line {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 19px;
      }
      .range-line input[type="range"] {
        flex: 1;
        width: 100%;
        accent-color: var(--primary);
        cursor: pointer;
        height: 24px;
      }
      .range-line output {
        font-weight: 600;
        white-space: nowrap;
        min-width: 45px;
        text-align: right;
      }
      .range-ends {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--secondary);
        margin-top: 1px;
      }
      .inline-note {
        padding: 11px 13px;
        border-radius: 8px;
        background: var(--primary-soft);
        color: var(--primary);
        display: flex;
        gap: 9px;
        font-size: 12px;
        line-height: 1.6;
      }
      .inline-note.amber {
        background: var(--amber-soft);
        color: var(--amber);
      }
      .inline-note .icon {
        margin-top: 2px;
        width: 18px;
        height: 18px;
      }
      .next-time {
        font-size: 36px;
        letter-spacing: -1px;
        font-weight: 500;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .next-time small {
        font-size: 13px;
        letter-spacing: 0;
      }
      .next-title {
        font-size: 17px;
        font-weight: 600;
        margin: 8px 0 12px;
      }
      .next-reason {
        font-size: 13px;
        line-height: 1.7;
        color: var(--secondary);
      }
      .next-reason strong {
        color: var(--text);
        font-weight: 500;
      }
      .struck {
        text-decoration: line-through;
      }
      .upcoming {
        border-top: 1px solid var(--line);
        margin-top: 17px;
        padding-top: 13px;
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 13px;
      }
      .upcoming .icon {
        color: var(--secondary);
      }
      .upcoming span {
        flex: 1;
      }
      .upcoming small {
        display: block;
        margin-top: 4px;
      }
      .reason-card {
        margin: 18px 0;
        padding: 18px 22px;
        display: flex;
        gap: 13px;
        align-items: flex-start;
      }
      .reason-card > .icon {
        color: var(--primary);
        margin-top: 1px;
      }
      .reason-card p {
        font-size: 14px;
        line-height: 1.7;
        margin: 5px 0;
        color: var(--secondary);
      }
      .reason-card p strong {
        color: var(--text);
        font-weight: 500;
      }
      .reason-card .link {
        color: var(--primary);
        font-size: 12px;
        padding: 4px 0;
      }
      .history-head {
        padding: 19px 22px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
      }
      .segmented {
        display: flex;
        border-radius: 20px;
        border: 1px solid var(--line);
        padding: 3px;
        gap: 2px;
      }
      .segmented button {
        padding: 6px 13px;
        border-radius: 16px;
        font-size: 12px;
        color: var(--secondary);
      }
      .segmented button.active {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 600;
      }
      .chart {
        padding: 16px 18px 0;
      }
      .chart svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .chart text {
        fill: var(--secondary);
        font-size: 11px;
      }
      .legend {
        display: flex;
        gap: 17px;
        flex-wrap: wrap;
        font-size: 12px;
        color: var(--secondary);
        padding: 0 22px 15px;
      }
      .dot {
        width: 8px;
        height: 8px;
        display: inline-block;
        border-radius: 50%;
        margin-right: 6px;
        background: var(--primary);
      }
      .dot.amber {
        background: #d59a27;
      }
      .dot.green {
        background: #40a477;
      }
      .history-events {
        border-top: 1px solid var(--line);
      }
      .event-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 13px 22px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }
      .event-row:last-child {
        border-bottom: 0;
      }
      .event-row:hover {
        background: var(--bg);
      }
      .event-row > small {
        min-width: 40px;
        font-variant-numeric: tabular-nums;
      }
      .event-row > .icon {
        width: 19px;
        height: 19px;
        color: var(--primary);
      }
      .event-copy {
        flex: 1;
        font-size: 13px;
      }
      .event-copy small {
        display: block;
        margin-top: 4px;
        font-size: 11px;
      }
      .event-row > b {
        font-weight: 500;
        font-size: 13px;
      }
      .more-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 14px 0;
      }
      .more-actions .btn {
        font-size: 12px;
      }
      .section-nav {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 0 0 17px;
      }
      .section-tab {
        padding: 9px 12px;
        display: flex;
        gap: 7px;
        align-items: center;
        border-radius: 22px;
        color: var(--secondary);
        font-size: 12px;
        white-space: nowrap;
      }
      .section-tab .icon {
        width: 18px;
        height: 18px;
      }
      .section-tab.active {
        background: var(--primary-soft);
        color: var(--primary);
        font-weight: 600;
      }
      .section-tab:hover {
        background: var(--card);
      }
      .section-intro {
        margin: 0 0 19px;
      }
      .section-intro p {
        margin-top: 6px;
        color: var(--secondary);
        line-height: 1.6;
        font-size: 13px;
      }
      .settings-stack {
        display: grid;
        gap: 17px;
      }
      .settings-card {
        padding: 21px;
      }
      .feature-header {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 17px;
        margin-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }
      .feature-header .feature-title {
        display: flex;
        gap: 11px;
        align-items: flex-start;
      }
      .feature-title > .icon {
        color: var(--primary);
        width: 25px;
        height: 25px;
      }
      .feature-title p {
        margin-top: 5px;
        color: var(--secondary);
        font-size: 12px;
        line-height: 1.6;
        max-width: 580px;
      }
      .field-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 19px 24px;
      }
      .field {
        min-width: 0;
      }
      .field.full {
        grid-column: 1/-1;
      }
      .field-title {
        font-size: 12px;
        font-weight: 550;
        display: flex;
        gap: 7px;
        align-items: center;
        margin-bottom: 9px;
        line-height: 1.4;
      }
      .help {
        border: 0;
        padding: 0;
        width: 19px;
        height: 19px;
        display: inline-grid;
        place-items: center;
        border-radius: 50%;
        color: var(--secondary);
        flex-shrink: 0;
      }
      .help .icon {
        width: 16px;
        height: 16px;
      }
      .help:hover {
        background: var(--primary-soft);
        color: var(--primary);
      }
      .input-frame {
        border: 1px solid var(--line);
        border-radius: 7px;
        min-height: 46px;
        display: flex;
        align-items: center;
        background: var(--card);
        overflow: hidden;
      }
      .input-frame:focus-within {
        border-color: var(--primary);
      }
      .input-frame > .icon {
        margin-left: 12px;
        color: var(--secondary);
        width: 19px;
        height: 19px;
      }
      .input-frame input,
      .input-frame select {
        border: 0;
        background: transparent;
        padding: 12px;
        width: 100%;
        min-width: 0;
        outline: none;
      }
      .input-frame span.unit {
        color: var(--secondary);
        padding: 0 12px;
        font-size: 12px;
        white-space: nowrap;
      }
      .input-frame input[type="number"] {
        appearance: textfield;
        -moz-appearance: textfield;
      }
      .stepper {
        border-left: 1px solid var(--line);
        display: flex;
        height: 44px;
        align-items: center;
      }
      .stepper button {
        width: 31px;
        height: 36px;
        color: var(--primary);
        font-size: 20px;
      }
      .field-hint {
        font-size: 11px;
        line-height: 1.6;
        color: var(--secondary);
        margin-top: 6px;
      }
      .field .range-line {
        margin-top: 0;
      }
      .field input[type="range"] {
        min-height: 30px;
        accent-color: var(--primary);
      }
      .range-number {
        width: 75px;
        flex-shrink: 0;
      }
      .range-number input {
        padding: 9px;
        width: 100%;
        text-align: center;
      }
      .field-toggle {
        display: flex;
        gap: 12px;
        align-items: center;
        min-height: 50px;
        justify-content: space-between;
      }
      .field-toggle .toggle-text {
        line-height: 1.5;
        font-size: 13px;
      }
      .field-toggle small {
        display: block;
        font-size: 11px;
        margin-top: 3px;
        line-height: 1.5;
      }
      .field-toggle .switch {
        transform: scale(0.9);
        transform-origin: right center;
      }
      .field-disabled {
        opacity: 0.65;
      }
      .field-disabled input:disabled,
      .field-disabled select:disabled,
      .field-disabled button:disabled {
        opacity: 1;
      }
      .field-disabled .input-frame,
      .field-disabled .range-line,
      .field-disabled .choices {
        pointer-events: none;
      }
      .chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .chip {
        padding: 8px 11px;

              .join("")
          : '<p class="empty-state">Žiadna zhoda. Skús časť názvu alebo ID.</p>';
      }
      function manualControl(action, value) {
        const c = get();
        clearTimeout(c.motionTimer);
        if (action === "stop") {
          c.moving = null;
          render();
          notify("Ukážka: pohyb zastavený.");
          return;
        }
        c.moving = action;
        render();
        c.motionTimer = setTimeout(() => {
          c.moving = null;
          c.position =
            value ??
            (action === "open"
              ? 100
              : action === "close"
                ? 0
                : action === "shade"
                  ? c.draft.shade_position
                  : c.draft.vent_position);
          c.manual = true;
          c.mode = "Ručná pauza";
          c.modeIcon = "hand";
          c.target = 0;
          if (selected === c.id) render();
          else renderList();
          notify(`Ukážka: poloha ${c.position} % · ochrana do 19:00.`);
        }, 900);
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("button,a[data-do],[data-event]");
        if (!b) return;
        if (b.dataset.do) e.preventDefault();
        if (b.disabled) return;
        if (b.dataset.select) {
          selected = b.dataset.select;
          render();
          return;
        }
        if (b.dataset.view) {
          view = b.dataset.view;
          render();
          return;
        }
        if (b.dataset.section) {
          section = b.dataset.section;
          render();
          return;
        }
        if (b.dataset.period) {
          period = b.dataset.period;
          render();
          return;
        }
        if (b.dataset.picker) {
          picker(b.dataset.picker);
          return;
        }
        if (b.hasAttribute("data-entity")) {
          cfg()[pickerKey] = b.dataset.entity;
          dirty();
          document.getElementById("dialog").close();
          render();
          return;
        }
        if (b.dataset.choice) {
          const k = b.dataset.choice,
            v = b.dataset.value;
          cfg()[k] = cfg()[k].includes(v)
            ? cfg()[k].filter((x) => x !== v)
            : [...cfg()[k], v];
          dirty();
          render();
          return;
        }
        if (b.dataset.step) {
          let k = b.dataset.step,
            f = F[k];
          cfg()[k] = Math.max(
            f.minimum,
            Math.min(f.maximum, Number(cfg()[k]) + Number(b.dataset.delta)),
          );
          dirty();
          render();
          return;
        }
        if (b.dataset.builder) {
          const k = b.dataset.builder;
          modal(
            F[k].label,
            `<p>V integrácii sa otvorí natívny vizuálny editor Home Assistanta. Nižšie je ukážka jeho skladby, bez vykonania akcie.</p><div class="builder"><div class="builder-row">${icon(F[k].kind === "condition" ? "shield" : "play")}<span>${F[k].kind === "condition" ? "Stav entity → okno je zatvorené" : "Oznámenie → žalúzia dosiahla cieľ"}</span></div></div><button class="btn primary" data-do="builder-save" data-builder-key="${k}" style="margin-top:18px" ${tip("Pridať iba ukážkovú položku do návrhu.")}>Pridať ukážkovú položku</button>`,
          );
          return;
        }
        if (b.dataset.control) {
          manualControl(b.dataset.control);
          b.setAttribute("aria-pressed", "true");
          return;
        }
        if (b.dataset.event) {
          const at = b.dataset.event,
            c = get(),
            manual = at === "18:00" && c.manual;
          modal(
            "Udalosť · " + at,
            `<dl><dt>Čo sa stalo</dt><dd>${at === "14:12" ? "Začalo tienenie na 58 %" : at === "07:05" ? "Ranné otvorenie na 100 %" : manual ? "Ručný pohyb na " + c.position + " %" : "Poloha potvrdená na " + c.position + " %"}</dd><dt>Zdroj polohy</dt><dd>Potvrdené zariadením</dd><dt>Dôvod</dt><dd>${at === "14:12" ? "Jas 38 400 lx, slnko v rozsahu okna" : at === "07:05" ? "Pracovný deň, splnený čas aj svetlo" : manual ? "Externý ručný zásah" : "Cieľ bol dosiahnutý"}</dd>${manual ? "<dt>Ručná ochrana</dt><dd>18:00–19:00</dd><dt>Pôvodný plán</dt><dd>Večerné zatvorenie o 18:30</dd><dt>Odklad</dt><dd>Do 19:00 pre ručnú ochranu</dd>" : ""}</dl><p class="muted">Ukážkové dáta. Produkčný detail použije skutočný typ, čas a vstupy každej udalosti.</p>`,
          );
          return;
        }
        const c = get();
        switch (b.dataset.do) {
          case "theme":
            document.body.classList.toggle("dark");
            break;
          case "save": {
            const invalid = Object.values(F).find(
              (f) =>
                f.kind === "number" &&
                (typeof cfg()[f.key] !== "number" ||
                  !Number.isFinite(cfg()[f.key]) ||
                  cfg()[f.key] < f.minimum ||
                  cfg()[f.key] > f.maximum),
            );
            if (invalid) {
              notify("Skontroluj hodnotu: " + invalid.label);
              return;
            }
            for (const p of ["morning", "evening"])
              for (const s of ["", "_free"])
                if (cfg()[p + "_early" + s] > cfg()[p + "_late" + s]) {
                  notify("Najskorší čas nemôže byť po najneskoršom.");
                  return;
                }
            c.saved = clone(c.draft);
            c.savedSim = c.sim;
            c.dirty = false;
            render();
            notify(
              "Nastavenia žalúzie " + c.draft.name + " sú uložené v ukážke.",
            );
            break;
          }
          case "discard":
            c.draft = clone(c.saved);
            c.sim = c.savedSim;
            c.dirty = false;
            render();
            notify("Rozpracované zmeny boli zahodené.");
            break;
          case "dismiss":
            document.getElementById("toast").hidden = true;
            break;
          case "close-dialog":
            document.getElementById("dialog").close();
            break;
          case "resume":
            c.manual = false;
            c.mode = "Denný plán";
            c.modeIcon = "calendar";
            c.next = "18:30";
            render();
            notify("Ukážka: ručná ochrana bola ukončená.");
            break;
          case "shade":
            manualControl("shade");
            break;
          case "vent":
            manualControl("vent");
            break;
          case "reset":
            modal(
              "Reset polohy",
              `<p>Žalúzia sa úplne zatvorí, po potvrdení dorazu sa podrží <strong>60 sekúnd</strong> a potom dostane STOP. Prerušenie sa neoznačí ako úspešný reset.</p><div class="inline-note">${icon("info")}Toto je návrh rozhrania. Žiadny motor sa nepohne.</div><button class="btn primary" data-do="demo-reset" style="margin-top:18px" ${tip("Spustiť iba ukážku priebehu resetu bez ovládania zariadenia.")}>Spustiť ukážku resetu</button>`,
            );
            break;
          case "demo-reset":
            document.getElementById("dialog").close();
            notify(
              "Ukážka resetu: zatváranie → potvrdenie dorazu → 60 s → STOP.",
            );
            break;
          case "reconcile":
            notify("Ukážka: podmienky aj odklad sa znova vyhodnotili.");
            break;
          case "reason":
            modal(
              "Prečo žalúzia čaká",
              `<dl><dt>Skutočná poloha</dt><dd>${c.position} % · zariadenie</dd><dt>Aktuálny cieľ</dt><dd>${c.target} %</dd><dt>Ručná ochrana</dt><dd>${c.manual ? "Aktívna do 19:00" : "Neaktívna"}</dd><dt>Návrat k cieľu</dt><dd>${c.draft.manual_return ? "Povolený" : "Vypnutý"}</dd><dt>Okno</dt><dd>Zatvorené · pohyb neblokuje</dd><dt>Časový plán</dt><dd>Večer od 18:30 do 21:30</dd></dl><p class="muted">Pri neznámom budúcom senzore UI uvedie „čaká na podmienky“, nie presný sľub pohybu.</p>`,
            );
            break;
          case "add":
            modal(
              "Pridať žalúziu",
              `<p>V integrácii toto tlačidlo otvorí existujúci natívny konfiguračný formulár Home Assistanta. Jedna žalúzia zostáva jednou samostatnou automatizáciou.</p><div class="inline-note">${icon("info")}Mockup používa štyri ukážkové žalúzie a nič nepridáva do Home Assistanta.</div>`,
            );
            break;
          case "builder-save":
            cfg()[b.dataset.builderKey] = [{ demo: true }];
            dirty();
            document.getElementById("dialog").close();
            render();
            break;
          case "about":
            modal(
              "Návrh v jazyku Home Assistanta",
              `<p>Samostatný HTML mockup s ukážkovými údajmi. Prepínače, pickery a časové prvky sú HTML/CSS ekvivalenty dostupné aj bez Home Assistanta.</p><p>Produkčná implementácia použije <strong>ha-switch, ha-button, ha-icon-button, ha-slider, ha-time-input, ha-duration-input, ha-entity-picker</strong> a natívne <strong>ha-selector</strong> editory. Overené v zdroji frontend verzie 20260930.3.</p><p>Funguje výber žalúzie, kategórie, ručné ovládanie ukážky, história, návrhy po žalúziách, fulltext picker, ukladanie v pamäti a toast so skrytím po 4 sekundách.</p><p>Žiadne nastavenie sa nezapisuje do HA. Po obnovení stránky sa ukážka vráti na začiatok.</p><p><a href="https://github.com/home-assistant/frontend/tree/20260930.3/src/components" target="_blank" rel="noreferrer">Overené komponenty Home Assistanta ↗</a></p>`,
            );
            break;
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "entity-search") {
          pickerResults(e.target.value);
          return;
        }
        if (e.target.matches("input[type=range][data-key]")) {
          cfg()[e.target.dataset.key] = Number(e.target.value);
          const sibling =
            e.target.parentElement.querySelector("input[type=number]");
          if (sibling) sibling.value = e.target.value;
          dirty();
        }
      });
      document.addEventListener("change", (e) => {
        let el = e.target;
        if (el.id === "manual-position") {
          manualControl("position", Number(el.value));
          return;
        }
        if (el.dataset.durationUnit) {
          const k = el.dataset.durationUnit,
            n = document.querySelector(`[data-duration="${k}"]`);
          n.dataset.multiplier = el.value;
          n.value = cfg()[k] / Number(el.value);
          return;
        }
        if (el.dataset.duration) {
          cfg()[el.dataset.duration] =
            Number(el.value) * Number(el.dataset.multiplier);
          dirty();
          return;
        }
        if (!el.dataset.key) return;
        const key = el.dataset.key;
        if (key === "enabled") {
          cfg().enabled = el.checked;
          get().saved.enabled = el.checked;
          render();
          notify(
            el.checked
              ? "Ukážka: automatické riadenie zapnuté."
              : "Ukážka: automatické riadenie vypnuté.",
          );
          return;
        }
        if (key === "simulation") {
          get().sim = el.checked;
          get().savedSim = el.checked;
          render();
          notify(
            el.checked
              ? "Ukážka: simulácia zapnutá, motor je zablokovaný."
              : "Ukážka: simulácia vypnutá.",
          );
          return;
        }
        cfg()[key] =
          F[key]?.kind === "bool"
            ? el.checked
            : F[key]?.kind === "number"
              ? Number(el.value)
              : el.value;
        dirty();
        if (
          F[key]?.kind === "bool" ||
          F[key]?.kind === "select" ||
          key === "name" ||
          F[key]?.kind === "time"
        )
          render();
        else if (key === "position_source") cfg().position_source_auto = false;
      });
      document.addEventListener("keydown", (e) => {
        if (
          (e.key === "Enter" || e.key === " ") &&
          e.target.matches("svg [data-event]")
        ) {
          e.preventDefault();
          e.target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        }
      });
      const tooltip = document.getElementById("tooltip");
      function showTip(e) {
        const el = e.target.closest?.("[data-tip]");
        if (!el) return;
        tooltip.textContent = el.dataset.tip;
        tooltip.hidden = false;
        const r = el.getBoundingClientRect();
        let left = Math.max(
          8,
          Math.min(r.left, innerWidth - tooltip.offsetWidth - 10),
        );
        let top = r.bottom + 8;
        if (top + tooltip.offsetHeight > innerHeight - 8)
          top = r.top - tooltip.offsetHeight - 8;
        tooltip.style.left = left + "px";
        tooltip.style.top = Math.max(8, top) + "px";
      }
      document.addEventListener("pointerover", showTip);
      document.addEventListener("focusin", showTip);
      document.addEventListener("pointerout", () => (tooltip.hidden = true));
      document.addEventListener("focusout", () => (tooltip.hidden = true));
      document.addEventListener("scroll", () => (tooltip.hidden = true), true);
      document.addEventListener("click", () => (tooltip.hidden = true));
      document.getElementById("dialog").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) {
          const r = e.currentTarget.getBoundingClientRect();
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            e.currentTarget.close();
        }
      });
      document.getElementById("brand").innerHTML =
        icon("cover") +
        "<div><h1>Žalúzie</h1><small>Riadenie, plán a história</small></div>";
      document.getElementById("theme-icon").innerHTML = icon("moon");
      document.getElementById("add-cover").innerHTML =
        icon("plus") + "Pridať žalúziu";
      render();
      window.addEventListener("resize", () => {
        const chartElement = document.querySelector(".chart");
        if (chartElement) chartElement.innerHTML = chart(get());
      });
      // For repeatable review of the prototype only. No Home Assistant API is used.
      window.mockup = {
        get selected() {
          return selected;
        },
        get view() {
          return view;
        },
        get section() {
          return section;
        },
        covers,
        fields: F,
        render,
        simulateUpdate() {
          const c = covers[1];
          c.position = c.position === 58 ? 57 : 58;
          renderList();
          return selected;
        },
      };
    </script>
  </body>
</html>
