<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CCA Žalúzie · izolovaný náhľad</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
      }
    </style>
  </head>
  <body>
    <p style="margin: 0; padding: 8px 20px; background: #fff2ca">
      Izolovaný náhľad · ukážkové údaje · bez ovládania motorov
    </p>
    <cca-zaluzie-panel></cca-zaluzie-panel>
    <script type="module">
      import "/custom_components/cca_zaluzie/frontend/cca-zaluzie-panel.js";
      window.fixture = await (
        await fetch("/tests/browser/fixture.json")
      ).json();
      window.calls = [];
      const hass = {
        states: Object.fromEntries(
          window.fixture.controllers.map((c) => [
            c.cover_entity,
            {
              state: "open",
              attributes: {
                friendly_name: c.name,
                current_position: c.position,
              },
            },
          ]),
        ),
        callWS: async (msg) => {
          window.calls.push(structuredClone(msg));
          if (msg.type === "cca_zaluzie/list")
            return structuredClone(window.fixture);
          if (msg.type === "cca_zaluzie/history")
            return {
              points: [
                {
                  at: new Date(
                    Date.now() - msg.hours * 3600000 + 300000,
                  ).toISOString(),
                  position: 0,
                  available: true,
                },
                {
                  at: new Date(
                    Date.now() - msg.hours * 3600000 + 1800000,
                  ).toISOString(),
                  position: 100,
                  available: true,
                },
                {
                  at: new Date(Date.now() - msg.hours * 1800000).toISOString(),
                  position: 58,
                  available: true,
                },
                {
                  at: new Date(Date.now() - 3600000).toISOString(),
                  position: 58,
                  available: true,
                },
                {
                  at: new Date(Date.now() - 1800000).toISOString(),
                  position: null,
                  available: false,
                },
                {
                  at: new Date(Date.now() - 900000).toISOString(),
                  position: 58,
                  available: true,
                },
                { at: new Date().toISOString(), position: 30, available: true },
              ],
              events: window.fixture.controllers.find(
                (c) => c.entry_id === msg.entry_id,
              ).events,
              start: new Date(Date.now() - msg.hours * 3600000).toISOString(),
              end: new Date().toISOString(),
            };
          if (msg.type === "cca_zaluzie/predict")
            return structuredClone(window.fixture.prediction || { events: [] });
          if (msg.type === "cca_zaluzie/reorder") {
            window.fixture.order = msg.entry_ids;
            return {
              order: msg.entry_ids,
              order_revision: ++window.fixture.order_revision,
            };
          }
          if (msg.type === "cca_zaluzie/configure_bulk") {
            if (window.failSave) throw Error("Nastavenia boli odmietnuté.");
            const configs = {};
            for (const id of msg.entry_ids) {
              const controller = window.fixture.controllers.find(
                (c) => c.entry_id === id,
              );
              Object.assign(controller.config, msg.patch);
              configs[id] = structuredClone(controller.config);
            }
            return { saved: true, configs };
          }
          const c = window.fixture.controllers.find(
            (c) => c.entry_id === msg.entry_id,
          );
          if (msg.type === "cca_zaluzie/configure") {
            if (window.saveGate) await window.saveGate;
            if (window.failSave) throw new Error("Nastavenia boli odmietnuté.");
            c.config = structuredClone(msg.config);
            c.name = c.config.name;
            return { saved: true, config: c.config };
          }
          if (msg.type === "cca_zaluzie/control") {
            c.server_time = Date.now() / 1000;
            if (window.failAction) throw new Error("Žalúzia nie je dostupná.");
            if (msg.action === "simulation_off")
              c.simulation = { enabled: false };
            if (msg.action === "simulation_on")
              c.simulation = { enabled: true };
            if (msg.action === "reset")
              c.runtime.reset = {
                status: "dwell",
                started: Date.now() / 1000,
                due: Date.now() / 1000 + 60,
              };
            if (msg.action === "cancel_reset")
              c.runtime.reset.status = "cancelled";
            return structuredClone(c);
          }
        },
        connection: {
          subscribeMessage: async (callback) => {
            window.publish = callback;
            return () => {
              window.unsubscribed = true;
            };
          },
        },
      };
      document.querySelector("cca-zaluzie-panel").hass = hass;
    </script>
  </body>
</html>
